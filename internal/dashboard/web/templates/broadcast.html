{{define "content"}}
{{$broadcasts := .Data.Broadcasts}}

<div class="rounded-xl bg-card p-4 shadow-xs ring-1 ring-foreground/10">
  <h2 class="mb-3 font-heading text-sm font-semibold tracking-tight">Kirim Broadcast Baru</h2>
  <form method="post" action="/admin/broadcast" class="flex flex-col gap-1">
    <input type="hidden" name="_csrf" value="{{$.CSRF}}">
    <label class="text-sm text-muted-foreground">Pesan</label>
    <textarea name="message" rows="4" required placeholder="Halo {{.Store}}..."
      class="border-input file:text-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-ring/50 w-full min-w-0 rounded-lg border bg-transparent px-2.5 py-1 text-base transition-colors outline-none focus-visible:ring-3 md:text-sm"></textarea>
    <div class="mt-2 flex items-center gap-2">
      <label class="text-sm text-muted-foreground">Segmen</label>
      <select name="segment"
        class="border-input file:text-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-ring/50 h-8 min-w-0 rounded-lg border bg-transparent px-2.5 py-1 text-sm transition-colors outline-none focus-visible:ring-3">
        <option value="all">Semua pelanggan aktif</option>
      </select>
    </div>
    <div class="mt-2">
      <button type="submit"
        class="inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/80 h-8 gap-1.5 px-2.5">
        {{icon "send"}}Kirim Broadcast
      </button>
    </div>
  </form>
</div>

<div class="rounded-xl bg-card p-4 shadow-xs ring-1 ring-foreground/10">
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b">
          <th class="px-2 py-2 text-left text-xs font-medium text-muted-foreground">ID</th>
          <th class="px-2 py-2 text-left text-xs font-medium text-muted-foreground">Pesan</th>
          <th class="px-2 py-2 text-right text-xs font-medium text-muted-foreground">Terkirim</th>
          <th class="px-2 py-2 text-right text-xs font-medium text-muted-foreground">Gagal</th>
          <th class="px-2 py-2 text-left text-xs font-medium text-muted-foreground">Status</th>
          <th class="px-2 py-2 text-left text-xs font-medium text-muted-foreground">Waktu</th>
        </tr>
      </thead>
      <tbody>
        {{range $broadcasts}}
        <tr class="border-b last:border-0 hover-row">
          <td class="px-2 py-2 tabular-nums">#{{.ID}}</td>
          <td class="px-2 py-2 max-w-96 text-xs text-muted-foreground break-words">{{.Message}}</td>
          <td class="px-2 py-2 text-right tabular-nums">{{.Sent}}</td>
          <td class="px-2 py-2 text-right tabular-nums">{{.Failed}}</td>
          <td class="px-2 py-2"><span class="badge {{badge .Status}}">{{statusLabel .Status}}</span></td>
          <td class="px-2 py-2 text-muted-foreground">{{ftime .CreatedAt}}</td>
        </tr>
        {{else}}
        <tr><td colspan="6"><div class="py-8 text-center text-sm text-muted-foreground">Belum ada broadcast.</div></td></tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
{{template "base" .}}
