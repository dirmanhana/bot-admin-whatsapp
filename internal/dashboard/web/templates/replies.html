{{define "content"}}
{{$replies := .Data.Replies}}

<div class="rounded-xl bg-card p-4 shadow-xs ring-1 ring-foreground/10">
  <h2 class="mb-3 font-heading text-sm font-semibold tracking-tight">Tambah Balasan Cepat</h2>
  <form method="post" action="/admin/replies" class="flex items-end gap-2">
    <input type="hidden" name="_csrf" value="{{$.CSRF}}">
    <div class="flex min-w-0 flex-1 flex-col gap-1">
      <label class="text-sm text-muted-foreground">Kata kunci</label>
      <input name="keyword" placeholder="harga" required
        class="border-input file:text-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-ring/50 h-8 w-full min-w-0 rounded-lg border bg-transparent px-2.5 py-1 text-base transition-colors outline-none focus-visible:ring-3 md:text-sm">
    </div>
    <div class="flex min-w-0 flex-[2] flex-col gap-1">
      <label class="text-sm text-muted-foreground">Balasan</label>
      <input name="reply" placeholder="Harga produk kami..." required
        class="border-input file:text-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-ring/50 h-8 w-full min-w-0 rounded-lg border bg-transparent px-2.5 py-1 text-base transition-colors outline-none focus-visible:ring-3 md:text-sm">
    </div>
    <button type="submit"
      class="inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/80 h-8 gap-1.5 px-2.5">
      {{icon "plus"}}Simpan
    </button>
  </form>
</div>

<div class="rounded-xl bg-card p-4 shadow-xs ring-1 ring-foreground/10">
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b">
          <th class="px-2 py-2 text-left text-xs font-medium text-muted-foreground">Kata Kunci</th>
          <th class="px-2 py-2 text-left text-xs font-medium text-muted-foreground">Balasan</th>
          <th class="px-2 py-2 text-left text-xs font-medium text-muted-foreground">Status</th>
          <th class="px-2 py-2 text-left text-xs font-medium text-muted-foreground">Aksi</th>
        </tr>
      </thead>
      <tbody>
        {{range $replies}}
        <tr class="border-b last:border-0 hover-row">
          <td class="px-2 py-2 font-medium">{{.Keyword}}</td>
          <td class="px-2 py-2 max-w-96 text-muted-foreground break-words">{{.Reply}}</td>
          <td class="px-2 py-2">
            {{if .IsActive}}<span class="badge badge-green">Aktif</span>{{else}}<span class="badge badge-gray">Nonaktif</span>{{end}}
          </td>
          <td class="px-2 py-2">
            <div class="flex items-center gap-1">
              <form method="post" action="/admin/replies/{{.ID}}/toggle">
                <input type="hidden" name="_csrf" value="{{$.CSRF}}">
                <button type="submit"
                  class="inline-flex shrink-0 items-center justify-center rounded-md border border-transparent bg-clip-padding text-xs font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 border-input bg-background shadow-xs hover:bg-accent hover:text-accent-foreground h-7 gap-1 px-2">
                  {{if .IsActive}}Nonaktifkan{{else}}Aktifkan{{end}}
                </button>
              </form>
              <form method="post" action="/admin/replies/{{.ID}}/delete" onsubmit="return confirm('Hapus balasan ini?')">
                <input type="hidden" name="_csrf" value="{{$.CSRF}}">
                <button type="submit"
                  class="inline-flex shrink-0 items-center justify-center rounded-md border border-transparent bg-clip-padding text-xs font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 text-destructive hover:bg-destructive/20 h-7 gap-1 px-2">
                  Hapus
                </button>
              </form>
            </div>
          </td>
        </tr>
        {{else}}
        <tr><td colspan="4"><div class="py-8 text-center text-sm text-muted-foreground">Belum ada balasan cepat.</div></td></tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
{{template "base" .}}
